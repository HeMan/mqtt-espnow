; PlatformIO Project Configuration File

[platformio]
default_envs = mqtt-espnow
src_dir = src

[env:mqtt-espnow]
platform = espressif32@6.13.0
framework = espidf
platform_packages =
    platformio/framework-espidf@3.50503.0
    platformio/toolchain-xtensa-esp-elf@14.2.0+20251107
    platformio/tool-cmake@3.30.2
    platformio/tool-ninja@1.13.2
    platformio/tool-mconf@1.4060000.20190628
    platformio/tool-esptoolpy@2.41100.260830
    platformio/tool-idf@1.0.1
    platformio/tool-esp-rom-elfs@0.0.1+20241011
monitor_speed = 115200
board = esp32dev
build_flags = -std=c++23

;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
